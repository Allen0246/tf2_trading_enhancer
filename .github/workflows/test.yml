name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # node --test discovers tests/ recursively from the repo root, matching
      # what `npm test` does locally. package.json declares no runtime
      # dependency the tests actually import, so no npm install step is
      # needed at all.
      - run: npm test
